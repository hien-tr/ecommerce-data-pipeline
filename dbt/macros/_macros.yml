version: 2

macros:
  - name: convert_to_usd
    description: >
      Converts an amount in another currency to USD, as NUMERIC rounded to 2 decimals.
      The rate must be units of that currency per 1 USD (as in int_fx_rates_daily),
      so the amount is divided by the rate. A zero or missing rate returns NULL
      instead of failing the model, so add a not_null test on the result.
      Example: {% raw %}{{ convert_to_usd('spend', 'rate') }}{% endraw %} as spend_usd
    arguments:
      - name: amount
        type: numeric
        description: Column or SQL expression with the amount in the original currency.
      - name: rate
        type: float64
        description: Column or SQL expression with the units of currency per 1 USD for that day.
