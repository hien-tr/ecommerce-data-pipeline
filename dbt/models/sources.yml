version: 2

sources:
  - name: thelook
    description: TheLook eCommerce public dataset, read in place (refreshed daily by Google).
    database: bigquery-public-data
    schema: thelook_ecommerce
    tables:
      - name: users
      - name: orders
      - name: order_items
      - name: products
        columns:
          - name: name
            description: Product name. A few products have no name in the source; staging fills them.
            data_tests:
              - not_null:
                  config:
                    severity: warn
      - name: events
