version: 2

sources:
  - name: thelook
    description: TheLook eCommerce public dataset, read in place (refreshed daily by Google).
    database: bigquery-public-data
    schema: thelook_ecommerce
    tables:
      - name: users
      - name: orders
      - name: order_items
      - name: products
        columns:
          - name: name
            description: Product name. A few products have no name in the source; staging fills them.
            data_tests:
              - not_null:
                  config:
                    severity: warn
      - name: events
  - name: raw
    description: Tables loaded by the Python ingestion scripts in ingestion/.
    schema: raw
    tables:
      - name: fx_rates
        description: Daily USD exchange rates from the Frankfurter API (ECB reference rates). Working days only.
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 4, period: day}
      - name: ad_spend
        description: Synthetic daily ad spend per channel, in each channel's billing currency.
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 4, period: day}
