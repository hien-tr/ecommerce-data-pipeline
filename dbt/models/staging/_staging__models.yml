version: 2

models:
  - name: stg_thelook__orders
    description: One row per order from TheLook, with cleaned names and lowercase status.
    columns:
      - name: order_id
        description: Primary key of the order.
        data_tests:
          - unique
          - not_null
      - name: user_id
        description: Customer who placed the order.
      - name: order_status
        description: Current order status (lowercase).
        data_tests:
          - accepted_values:
              arguments:
                values: ['processing', 'shipped', 'complete', 'cancelled', 'returned']
              config:
                severity: warn
      - name: item_count
        description: Number of items in the order, as reported by the source.
      - name: created_at
        description: When the order was placed (UTC).

  - name: stg_thelook__order_items
    description: One row per item in an order. sale_price is the price paid for that single item.
    columns:
      - name: order_item_id
        description: Primary key of the order item.
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: Order this item belongs to.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_thelook__orders')
                field: order_id
      - name: product_id
        description: Product sold.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_thelook__products')
                field: product_id
      - name: item_status
        description: Status of this item (lowercase). Items in one order can have different statuses.
        data_tests:
          - accepted_values:
              arguments:
                values: ['processing', 'shipped', 'complete', 'cancelled', 'returned']
              config:
                severity: warn
      - name: sale_price
        description: Price paid for the item, in USD.

  - name: stg_thelook__products
    description: One row per product in the TheLook catalogue.
    columns:
      - name: product_id
        description: Primary key of the product.
        data_tests:
          - unique
          - not_null
      - name: product_name
        description: Product name. Filled with 'Unknown product (<product_id>)' when the source name is missing.
      - name: product_cost
        description: Cost of the product to the business, in USD.
      - name: retail_price
        description: List price of the product, in USD.

  - name: stg_thelook__users
    description: >
      One row per customer from TheLook. TheLook is synthetic, but columns that would be
      personal data in a real business are tagged contains_pii and kept out of marts.
    columns:
      - name: user_id
        description: Primary key of the customer.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name (personal data).
        config:
          meta:
            contains_pii: true
      - name: last_name
        description: Customer last name (personal data).
        config:
          meta:
            contains_pii: true
      - name: email
        description: Customer email address (personal data).
        config:
          meta:
            contains_pii: true
      - name: age
        description: Customer age in years.
      - name: gender
        description: Customer gender as reported by the source (F or M).
        data_tests:
          - accepted_values:
              arguments:
                values: ['F', 'M']
              config:
                severity: warn
      - name: street_address
        description: Customer street address (personal data).
        config:
          meta:
            contains_pii: true
      - name: postal_code
        description: Customer postal code (personal data).
        config:
          meta:
            contains_pii: true
      - name: latitude
        description: Latitude of the customer's address (personal data).
        config:
          meta:
            contains_pii: true
      - name: longitude
        description: Longitude of the customer's address (personal data).
        config:
          meta:
            contains_pii: true
      - name: user_geom
        description: Geographic point of the customer's address (personal data).
        config:
          meta:
            contains_pii: true
      - name: traffic_source
        description: >
          Channel that brought the customer to sign up (lowercase). Uses different values
          from events.traffic_source, so channel mapping is needed for attribution.
        data_tests:
          - accepted_values:
              arguments:
                values: ['search', 'organic', 'facebook', 'email', 'display']
              config:
                severity: warn
      - name: created_at
        description: When the customer signed up (UTC).

  - name: stg_thelook__events
    description: One row per website event (page view, cart, purchase and similar) from TheLook.
    columns:
      - name: event_id
        description: Primary key of the event.
        data_tests:
          - unique
          - not_null
      - name: user_id
        description: Customer who triggered the event. Null for visitors who are not signed in.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_thelook__users')
                field: user_id
      - name: session_id
        description: Website session the event belongs to.
      - name: sequence_number
        description: Position of the event within its session, starting at 1.
      - name: event_type
        description: Type of event, such as product view, cart or purchase.
        data_tests:
          - accepted_values:
              arguments:
                values: ['product', 'department', 'cart', 'purchase', 'cancel', 'home']
              config:
                severity: warn
      - name: traffic_source
        description: Channel the session came from (lowercase).
        data_tests:
          - accepted_values:
              arguments:
                values: ['email', 'adwords', 'facebook', 'youtube', 'organic']
              config:
                severity: warn
      - name: ip_address
        description: IP address of the visitor (personal data).
        config:
          meta:
            contains_pii: true
      - name: postal_code
        description: Postal code derived from the visitor's location (personal data).
        config:
          meta:
            contains_pii: true
      - name: created_at
        description: When the event happened (UTC).

  - name: stg_marketing__ad_spend
    description: One row per day and paid channel. Spend is in the channel's billing currency (see currency).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - spend_date
              - channel
    columns:
      - name: spend_date
        description: Day the spend applies to.
        data_tests:
          - not_null
      - name: channel
        description: Paid marketing channel (lowercase), matching stg_thelook__users.traffic_source.
        data_tests:
          - accepted_values:
              arguments:
                values: ['search', 'facebook', 'display', 'email']
              config:
                severity: warn
      - name: currency
        description: Billing currency of the spend.
        data_tests:
          - accepted_values:
              arguments:
                values: ['USD', 'EUR', 'GBP']
              config:
                severity: warn
      - name: spend
        description: Ad spend in the billing currency (exact decimal). Convert to USD with the FX rates before comparing channels.
        data_tests:
          - not_null
      - name: loaded_at
        description: When the ingestion script loaded this row (UTC).

  - name: stg_frankfurter__fx_rates
    description: Daily USD exchange rates from the Frankfurter API (ECB reference rates). Working days only; gaps are filled in int_fx_rates_daily.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - rate_date
              - currency
    columns:
      - name: rate_date
        description: Day the rate is valid for (ECB working days only).
        data_tests:
          - not_null
      - name: base_currency
        description: Currency converted from (always USD).
        data_tests:
          - accepted_values:
              arguments:
                values: ['USD']
              config:
                severity: warn
      - name: currency
        description: Currency converted to.
        data_tests:
          - accepted_values:
              arguments:
                values: ['EUR', 'GBP']
              config:
                severity: warn
      - name: rate
        description: Units of currency per 1 USD.
        data_tests:
          - not_null
      - name: loaded_at
        description: When the ingestion script loaded this row (UTC).
