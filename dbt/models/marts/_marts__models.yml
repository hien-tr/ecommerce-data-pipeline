version: 2

models:
  - name: fct_orders
    description: >
      One row per order from the TheLook online store, with revenue and margin
      in USD. Use this table for any question about orders, revenue or margin.
      When someone asks for "revenue" without more detail, use net_revenue.
    columns:
      - name: order_id
        description: Primary key of the order.
        data_tests:
          - unique
          - not_null
      - name: user_id
        description: Customer who placed the order.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: user_id
      - name: order_status
        description: >
          Current status of the whole order (lowercase): processing, shipped,
          complete, cancelled or returned. Items inside one order can have
          different statuses, so revenue is calculated per item, not from this column.
        data_tests:
          - accepted_values:
              arguments:
                values: ['processing', 'shipped', 'complete', 'cancelled', 'returned']
              config:
                severity: warn
      - name: created_at
        description: When the order was placed (UTC timestamp).
      - name: order_date
        description: Date the order was placed (UTC). Use this to group revenue by day, month or year.
      - name: shipped_at
        description: When the order was shipped (UTC). Null if not shipped yet.
      - name: delivered_at
        description: When the order was delivered (UTC). Null if not delivered yet.
      - name: returned_at
        description: When the order was returned (UTC). Null if not returned.
      - name: item_count
        description: Number of items in the order, counted from the order items.
      - name: cancelled_item_count
        description: Number of items in the order that were cancelled.
      - name: returned_item_count
        description: Number of items in the order that were returned.
      - name: gross_revenue
        description: >
          Revenue in USD from all items that were not cancelled, including items
          that were later returned. Use only when gross revenue is explicitly asked for.
      - name: net_revenue
        description: >
          Revenue in USD from items that were neither cancelled nor returned.
          This is the default meaning of "revenue" for this business.
      - name: net_margin
        description: >
          net_revenue minus the cost of those same items, in USD. Use for
          "margin" or "profit" questions.

  - name: fct_ad_spend
    description: >
      One row per day and paid marketing channel, with ad spend in the billing
      currency and in USD. Use spend_usd for any question about marketing spend.
      Organic has no spend and is not in this table, so models that compare spend
      with revenue per channel must keep organic from the revenue side (for example
      with a full outer join), otherwise organic revenue is lost.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - spend_date
              - channel
    columns:
      - name: spend_date
        description: Day the spend applies to (UTC).
        data_tests:
          - not_null
      - name: channel
        description: >
          Paid marketing channel (search, facebook, display, email), matching the
          customers' sign-up channel. Allowed values are tested in stg_marketing__ad_spend.
      - name: currency
        description: Billing currency of the spend (USD, EUR or GBP).
        data_tests:
          - relationships:
              arguments:
                to: ref('int_fx_rates_daily')
                field: currency
      - name: spend
        description: >
          Spend in the billing currency. Do not sum across channels or currencies;
          use spend_usd instead.
      - name: rate
        description: Units of the billing currency per 1 USD on spend_date, used to convert spend to USD.
        data_tests:
          - not_null
      - name: is_rate_carried_forward
        description: >
          True when no rate was published on spend_date (weekend or ECB holiday) and the
          most recent published rate was used instead.
      - name: spend_usd
        description: Spend converted to USD (spend ÷ rate), at full precision. Sum this column for total spend.
        data_tests:
          - not_null

  - name: dim_customers
    description: >
      One row per customer of the TheLook online store, including customers who
      never ordered. Use it to slice orders and spend by the channel that brought the
      customer (first-touch attribution) and to find new customers. Contains no
      personal data.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "first_order_date is null or first_order_date >= date(signed_up_at)"
          config:
            severity: warn
    columns:
      - name: user_id
        description: Primary key of the customer.
        data_tests:
          - unique
          - not_null
      - name: channel
        description: >
          Channel that brought the customer to sign up (search, organic, facebook, email,
          display). Revenue is attributed to this channel for all of the customer's orders.
          The paid channels must match fct_ad_spend.channel for the marketing join.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['search', 'organic', 'facebook', 'email', 'display']
              config:
                severity: warn
      - name: signed_up_at
        description: When the customer signed up (UTC).
      - name: first_order_date
        description: >
          Date of the customer's first order that was not cancelled (UTC). Empty if the
          customer never placed such an order. A customer counts as new in the month of
          this date.

  - name: mart_marketing_performance
    description: >
      One row per day and channel with ad spend, revenue, orders and new customers,
      for the days that have ad spend data. Revenue and new customers are attributed to
      the channel the customer signed up through (first touch). All measures are sums
      or counts, so they can be added up to any period. Calculate ROAS as
      sum(net_revenue) / sum(spend_usd) and CAC as sum(spend_usd) / sum(new_customers);
      never average daily ratios. Organic has revenue but no spend.
      This is calendar ROAS: revenue includes orders from customers acquired before the
      period, so it overstates the return on that period's spend.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date
              - channel
    columns:
      - name: date
        description: Day of the spend, orders and first orders (UTC).
        data_tests:
          - not_null
      - name: channel
        description: Sign-up channel (search, facebook, display, email, organic).
        data_tests:
          - not_null
      - name: spend_usd
        description: Ad spend in USD that day, rounded to cents. 0 for organic.
        data_tests:
          - not_null
      - name: net_revenue
        description: >
          Net revenue in USD of that day's orders by customers who signed up through the
          channel, rounded to cents. Cancelled orders are excluded.
        data_tests:
          - not_null
      - name: orders
        description: Number of orders that day by customers from the channel, excluding cancelled orders.
        data_tests:
          - not_null
      - name: new_customers
        description: Customers from the channel whose first (not cancelled) order was that day.
        data_tests:
          - not_null
